trigger:
  branches:
    include:
      - main_surya

pr:
  branches:
    include:
      - main_surya

variables:
  terraformVersion: "1.8.5"
  workingDirectory: "."
  backendServiceArm: "Azuredevops"
  system.debug: true

stages:

#==========================================================
# VALIDATION
#==========================================================
- stage: Validate
  displayName: "Terraform Validation"

  jobs:

  - job: Validate

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(terraformVersion)

    - script: |
        terraform fmt -check -recursive
      displayName: Terraform FMT

    - script: |
        echo "Build.SourcesDirectory=$(Build.SourcesDirectory)"
        pwd
        ls -la
        find . -maxdepth 2
      displayName: "Debug Repository"

    - script: |
        terraform init -backend=false
      workingDirectory: $(workingDirectory)
      displayName: Terraform Init

    - script: |
        terraform validate
      workingDirectory: $(workingDirectory)
      displayName: Terraform Validate

    - script: |
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
        tflint
      workingDirectory: $(workingDirectory)
      displayName: TFLint

    - script: |
        pip install checkov
        checkov -d . --skip-path modules --output json --soft-fail > checkov-report.json
      workingDirectory: $(workingDirectory)
      displayName: Checkov Scan

    - publish: checkov-report.json
      artifact: checkov-report

    - script: |
        pwd
        find . -name "*.tf"
        echo "----------------------"
        cat modules/azurerm_aks/main.tf
      displayName: Debug Terraform Files

    - script: |
        docker run --rm \
        -v $(System.DefaultWorkingDirectory):/project \
        aquasec/trivy config /project
      displayName: Trivy Config Scan


#==========================================================
# PLAN DEV
#==========================================================

- stage: Plan_DEV

  dependsOn: Validate

  jobs:

  - job: TerraformPlanDEV

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(terraformVersion)

    - task: AzureCLI@2
      displayName: Terraform Init & Plan (DEV)
      inputs:
        azureSubscription: $(backendServiceArm)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: $(workingDirectory)
        inlineScript: |
          export TF_VAR_subscription_id=$(az account show --query id -o tsv)
          export TF_VAR_tenant_id=$(az account show --query tenantId -o tsv)

          terraform init
          terraform workspace select dev || terraform workspace new dev
          terraform plan \
            -var-file=dev/dev.tfvars \
            -out=tfplan

    - publish: $(workingDirectory)/tfplan
      artifact: tfplan-dev


#==========================================================
# APPLY DEV
#==========================================================

- stage: Apply_DEV

  dependsOn: Plan_DEV

  jobs:

  - deployment: ApplyDEV

    environment: DEV

    strategy:

      runOnce:

        deploy:

          steps:

          # deployment jobs don't auto-checkout — must be explicit
          - checkout: self

          - download: current
            artifact: tfplan-dev

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AzureCLI@2
            displayName: Terraform Apply (DEV)
            inputs:
              azureSubscription: $(backendServiceArm)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: $(workingDirectory)
              inlineScript: |
                export TF_VAR_subscription_id=$(az account show --query id -o tsv)
                export TF_VAR_tenant_id=$(az account show --query tenantId -o tsv)

                cp $(Pipeline.Workspace)/tfplan-dev/tfplan ./tfplan

                terraform init
                terraform workspace select dev || terraform workspace new dev
                terraform apply tfplan


#==========================================================
# POST VALIDATION
#==========================================================

- stage: PostValidation

  dependsOn: Apply_DEV

  jobs:

  - job: Verify

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: $(terraformVersion)

    - task: AzureCLI@2
      displayName: Terraform Output & Verify AKS
      inputs:
        azureSubscription: $(backendServiceArm)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: $(workingDirectory)
        inlineScript: |
          export TF_VAR_subscription_id=$(az account show --query id -o tsv)
          export TF_VAR_tenant_id=$(az account show --query tenantId -o tsv)

          terraform init
          terraform workspace select dev
          terraform output
          az aks list


#==========================================================
# PLAN QA
#==========================================================

- stage: Plan_QA

  dependsOn: PostValidation

  jobs:

  - job: TerraformPlanQA

