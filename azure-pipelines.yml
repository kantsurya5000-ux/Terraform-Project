trigger:
  branches:
    include:
      - main_surya

pr:
  branches:
    include:
      - main_surya

variables:
  terraformVersion: "1.8.5"
  workingDirectory: "."
  azureServiceConnection: "Azuredevops"

# Define these four values as pipeline variables or in a linked variable group.
# The service connection must have Storage Blob Data Contributor on the state container.
# TF_BACKEND_RESOURCE_GROUP
# TF_BACKEND_STORAGE_ACCOUNT
# TF_BACKEND_CONTAINER
# TF_BACKEND_KEY

stages:
  - stage: Validate
    displayName: Validate and scan
    jobs:
      - job: TerraformValidation
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - script: terraform fmt -check -recursive
            workingDirectory: $(workingDirectory)
            displayName: Terraform formatting

          - script: terraform init -backend=false -input=false
            workingDirectory: $(workingDirectory)
            displayName: Terraform initialization

          - script: terraform validate
            workingDirectory: $(workingDirectory)
            displayName: Terraform validation

          - script: |
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              tflint --init
              tflint
            workingDirectory: $(workingDirectory)
            displayName: TFLint

          - script: |
              python -m pip install --disable-pip-version-check checkov
              checkov -d . --skip-path modules --output json --soft-fail > checkov-report.json
            workingDirectory: $(workingDirectory)
            displayName: Checkov scan

          - publish: $(workingDirectory)/checkov-report.json
            artifact: checkov-report
            displayName: Publish Checkov report

  - stage: Plan
    displayName: Plan shared AKS cluster
    dependsOn: Validate
    jobs:
      - job: TerraformPlan
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AzureCLI@2
            displayName: Terraform plan
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(workingDirectory)
              inlineScript: |
                terraform init -input=false \
                  -backend-config="resource_group_name=$(TF_BACKEND_RESOURCE_GROUP)" \
                  -backend-config="storage_account_name=$(TF_BACKEND_STORAGE_ACCOUNT)" \
                  -backend-config="container_name=$(TF_BACKEND_CONTAINER)" \
                  -backend-config="key=$(TF_BACKEND_KEY)" \
                  -backend-config="use_azuread_auth=true"
                terraform plan -input=false -out=tfplan

          - publish: $(workingDirectory)/tfplan
            artifact: shared-aks-plan
            displayName: Publish Terraform plan

  - stage: Apply
    displayName: Apply shared AKS cluster
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main_surya'))
    jobs:
      - deployment: ApplySharedAks
        displayName: Apply shared AKS cluster
        environment: shared-aks
        # Configure approval checks on the shared-aks Azure DevOps environment.
        pool:
          name: aks-private-agent-pool
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: shared-aks-plan

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)

                - task: AzureCLI@2
                  displayName: Terraform apply
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(workingDirectory)
                    inlineScript: |
                      terraform init -input=false \
                        -backend-config="resource_group_name=$(TF_BACKEND_RESOURCE_GROUP)" \
                        -backend-config="storage_account_name=$(TF_BACKEND_STORAGE_ACCOUNT)" \
                        -backend-config="container_name=$(TF_BACKEND_CONTAINER)" \
                        -backend-config="key=$(TF_BACKEND_KEY)" \
                        -backend-config="use_azuread_auth=true"
                      terraform apply -input=false "$(Pipeline.Workspace)/shared-aks-plan/tfplan"

  - stage: Verify
    displayName: Verify shared AKS cluster
    dependsOn: Apply
    jobs:
      - job: VerifyCluster
        pool:
          name: aks-private-agent-pool
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)

          - task: AzureCLI@2
            displayName: Verify cluster and namespaces
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(workingDirectory)
              inlineScript: |
                terraform init -input=false \
                  -backend-config="resource_group_name=$(TF_BACKEND_RESOURCE_GROUP)" \
                  -backend-config="storage_account_name=$(TF_BACKEND_STORAGE_ACCOUNT)" \
                  -backend-config="container_name=$(TF_BACKEND_CONTAINER)" \
                  -backend-config="key=$(TF_BACKEND_KEY)" \
                  -backend-config="use_azuread_auth=true"
                terraform output
                az aks get-credentials \
                  --resource-group rg-aks-shared \
                  --name aks-shared-devqa-prod \
                  --overwrite-existing
                kubelogin convert-kubeconfig -l azurecli
                kubectl get namespaces dev qa prod
