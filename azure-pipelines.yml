          terraform init
          terraform workspace select qa || terraform workspace new qa
          terraform plan \
            -var-file=qa/qa.tfvars \
            -out=tfplan

    - publish: $(workingDirectory)/tfplan
      artifact: tfplan-qa


#==========================================================
# APPLY QA
#==========================================================

- stage: Apply_QA

  dependsOn: Plan_QA

  jobs:

  - deployment: ApplyQA

    environment: QA

    strategy:

      runOnce:

        deploy:

